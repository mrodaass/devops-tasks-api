name: CI

# ¿Cuándo se ejecuta?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- Job 1: pruebas ----------
  test:
    runs-on: ubuntu-24.04 
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5  

      - name: Instalar Python 3.11
        uses: actions/setup-python@v6 
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest -v

  # ---------- Job 2: construir y probar la imagen ----------
  build:
    needs: test          # Solo corre si "test" pasó
    runs-on: ubuntu-24.04  
    permissions:
      contents: read     # leer el código
      packages: write    # publicar imágenes en GHCR
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5   

      - name: Construir imagen Docker
        run: docker build -t devops-tasks-api:${{ github.sha }} .

      - name: Smoke test (¿arranca y responde /health?)
        run: |
          docker run -d --name api -p 8000:8000 devops-tasks-api:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -fs http://localhost:8000/health; then
              echo "La API responde"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondió"
          docker logs api
          exit 1
          
      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar imagen
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag devops-tasks-api:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag devops-tasks-api:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest